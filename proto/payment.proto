syntax = "proto3";

package paysafe.payment.v1;

// Coordinator-to-worker contract for simulated payment processing.
service PaymentWorker {
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  rpc CheckHealth(HealthCheckRequest) returns (HealthCheckResponse);
}

message ProcessPaymentRequest {
  string transaction_id = 1;
  string amount = 2;
  string description = 3;
  // Logical time sent by the coordinator. Zero means unset for older clients.
  int32 lamport_time = 4;
}

message ProcessPaymentResponse {
  string transaction_id = 1;
  string status = 2;
  string worker_id = 3;
  string message = 4;
  // Logical time attached by the worker when it sends this response.
  int32 lamport_time = 5;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string worker_id = 1;
  string status = 2;
}
